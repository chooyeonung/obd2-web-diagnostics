<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OBD2-DIAG 콘솔</title>
<style>
  body { font-family: monospace; background:#12151c; color:#e8eaf0; margin:0; padding:1rem; }
  h1 { font-size:1rem; color:#8a93a6; }
  #log { background:#0d0f14; border-radius:6px; padding:.6rem; height:60vh; overflow-y:auto; white-space:pre-wrap; font-size:.8rem; }
  .row { display:flex; gap:.5rem; margin-top:.6rem; }
  input { flex:1; background:#1a1f2b; border:1px solid #2a3040; color:#e8eaf0; border-radius:6px; padding:.5rem; }
  button { background:#2f6fed; color:#fff; border:none; border-radius:6px; padding:.5rem 1rem; }
  .quick { margin-top:.5rem; display:flex; gap:.4rem; flex-wrap:wrap; }
  .quick button { background:#2a3040; font-size:.75rem; padding:.3rem .6rem; }
</style>
</head>
<body>
<h1>OBD2-DIAG 테스트 콘솔 <span id="st">● 연결 안 됨</span></h1>
<div id="log"></div>
<div class="row">
  <input id="cmd" placeholder="명령 입력 (예: ATZ, 010C)" />
  <button onclick="send()">전송</button>
</div>
<div class="quick">
  <button onclick="sendCmd('ATZ')">ATZ</button>
  <button onclick="sendCmd('ATE0')">ATE0</button>
  <button onclick="sendCmd('010C')">RPM</button>
  <button onclick="sendCmd('010D')">차속</button>
  <button onclick="sendCmd('0105')">냉각수온</button>
  <button onclick="sendCmd('03')">DTC 조회</button>
  <button onclick="sendCmd('0902')">VIN</button>
</div>
<script>
// 이 페이지는 펌웨어 벤치 테스트용 미니 콘솔입니다.
// 본 웹앱(Blazor)은 WebSocketTransport로 ws://192.168.4.1/ws 에 연결하세요.
const log = (s) => { const el = document.getElementById('log'); el.textContent += s + "\n"; el.scrollTop = el.scrollHeight; };
let ws = new WebSocket(`ws://${location.host}/ws`);
ws.onopen = () => document.getElementById('st').textContent = '● 연결됨';
ws.onclose = () => document.getElementById('st').textContent = '● 끊어짐';
ws.onmessage = (e) => log(e.data.replace(/\r/g, '\n').replace(/>/g, ''));
function sendCmd(c) { log('> ' + c); ws.send(c + '\r'); }
function send() { const i = document.getElementById('cmd'); if (i.value) { sendCmd(i.value); i.value = ''; } }
document.getElementById('cmd').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// ---------- OTA ----------
fetch('/ota/status').then(r=>r.json()).then(j=>{
  document.getElementById('fwinfo').textContent =
    `현재: ${j.version} (${j.partition}) · IDF ${j.idf} · 빌드 ${j.date}`;
}).catch(()=>{});
async function otaUpload() {
  const f = document.getElementById('fw').files[0];
  const prog = document.getElementById('fwprog');
  const btn = document.getElementById('fwbtn');
  if (!f) { prog.textContent = '.bin 파일을 먼저 선택하세요'; return; }
  if (!f.name.endsWith('.bin')) { prog.textContent = '앱 바이너리(.bin)만 업로드 가능합니다'; return; }
  if (!confirm(`${f.name} (${(f.size/1024/1024).toFixed(2)}MB)로 펌웨어를 교체할까요?`)) return;
  btn.disabled = true;
  prog.textContent = '업로드 중... (30초~2분, WiFi 연결을 유지하세요)';
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/ota');
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) prog.textContent = `업로드 중... ${Math.round(e.loaded/e.total*100)}%`;
    };
    xhr.onload = () => {
      if (xhr.status === 200) {
        prog.textContent = '✅ 완료 — 3초 후 재부팅합니다. 잠시 뒤 새로고침하세요.';
        setTimeout(()=>location.reload(), 12000);
      } else {
        prog.textContent = '❌ 실패: ' + xhr.responseText;
        btn.disabled = false;
      }
    };
    xhr.onerror = () => { prog.textContent = '❌ 연결 오류 (기기가 재부팅됐다면 정상일 수 있음)'; btn.disabled = false; };
    xhr.send(f);
  } catch (e) { prog.textContent = '❌ ' + e; btn.disabled = false; }
}
</script>
<details style="margin-top:1rem">
  <summary style="color:#8a93a6;cursor:pointer">펌웨어 업데이트 (OTA)</summary>
  <div style="margin-top:.6rem;background:#0d0f14;border-radius:6px;padding:.8rem">
    <div id="fwinfo" style="font-size:.75rem;color:#8a93a6;margin-bottom:.6rem">버전 확인 중...</div>
    <input type="file" id="fw" accept=".bin" style="padding:.3rem" />
    <button id="fwbtn" onclick="otaUpload()">업로드</button>
    <div id="fwprog" style="font-size:.8rem;margin-top:.5rem"></div>
  </div>
</details>
</body>
</html>

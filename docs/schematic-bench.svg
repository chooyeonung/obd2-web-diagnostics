<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" font-family="'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1a1a19; stroke-width: 1.6; }
      .wire { stroke: #1a1a19; stroke-width: 1.6; fill: none; }
      .pwr { stroke: #c0392b; stroke-width: 2; fill: none; }
      .can { stroke: #1c5cab; stroke-width: 2; fill: none; }
      .gndw { stroke: #1a1a19; stroke-width: 2; fill: none; }
      .name { font-size: 14px; font-weight: 700; fill: #1a1a19; }
      .pin { font-size: 11px; fill: #1a1a19; }
      .net { font-size: 11px; font-weight: 700; }
      .note { font-size: 11px; fill: #52514e; }
      .warn { font-size: 11px; font-weight: 700; fill: #c0392b; }
      .dot { fill: #1a1a19; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="780" fill="#ffffff"/>

  <!-- 타이틀 -->
  <text x="40" y="42" font-size="20" font-weight="800" fill="#1a1a19">OBD-II 진단 게이트웨이 — 벤치 조립 회로도 (모듈 단위)</text>
  <text x="40" y="64" class="note">Rev A · 2026-08-08 · 주문 부품 기준: VND018 / SZH-PWSD-001 / VLT-CAN002 / FRU110-30F / SS34 / P6KE24A / OBD-II 조립형 커넥터</text>

  <!-- ═══════════ OBD-II 커넥터 ═══════════ -->
  <rect x="40" y="170" width="150" height="330" class="box"/>
  <text x="115" y="192" text-anchor="middle" class="name">OBD-II (J1962)</text>
  <text x="115" y="208" text-anchor="middle" class="pin">Male · 조립형</text>

  <text x="60" y="244" class="pin">16 · +12V 상시</text>
  <text x="60" y="334" class="pin">6 · CAN-H</text>
  <text x="60" y="374" class="pin">14 · CAN-L</text>
  <text x="60" y="454" class="pin">4 · 섀시 GND</text>
  <text x="60" y="484" class="pin">5 · 시그널 GND</text>

  <!-- ═══════════ 전원 체인 (+12V, y=240) ═══════════ -->
  <!-- 16번 → 폴리스위치 -->
  <line x1="190" y1="240" x2="262" y2="240" class="pwr"/>
  <!-- 폴리스위치 심볼 -->
  <rect x="262" y="230" width="64" height="20" class="box"/>
  <text x="294" y="222" text-anchor="middle" class="pin">FRU110-30F</text>
  <text x="294" y="264" text-anchor="middle" class="note">폴리스위치 1.1A</text>
  <!-- → SS34 -->
  <line x1="326" y1="240" x2="396" y2="240" class="pwr"/>
  <!-- SS34 다이오드 심볼 (▶|) -->
  <polygon points="396,230 396,250 420,240" fill="#1a1a19"/>
  <line x1="420" y1="228" x2="420" y2="252" class="wire" stroke-width="2.4"/>
  <text x="408" y="222" text-anchor="middle" class="pin">SS34</text>
  <text x="408" y="264" text-anchor="middle" class="note">역접속 보호</text>
  <!-- → 노드 A → LM2596 IN+ -->
  <line x1="420" y1="240" x2="600" y2="240" class="pwr"/>
  <circle cx="520" cy="240" r="3.5" class="dot"/>
  <text x="452" y="232" class="net" fill="#c0392b">+12V_PROT</text>

  <!-- P6KE24A (노드 A → GND, 수직) -->
  <line x1="520" y1="240" x2="520" y2="288" class="wire"/>
  <line x1="508" y1="288" x2="532" y2="288" class="wire" stroke-width="2.4"/>
  <polygon points="508,312 532,312 520,290" fill="#1a1a19"/>
  <line x1="520" y1="312" x2="520" y2="620" class="wire"/>
  <text x="500" y="296" text-anchor="end" class="pin">P6KE24A</text>
  <text x="500" y="310" text-anchor="end" class="note">TVS · 밴드 위쪽(+)</text>

  <!-- ═══════════ LM2596 모듈 ═══════════ -->
  <rect x="600" y="200" width="190" height="110" class="box"/>
  <text x="695" y="226" text-anchor="middle" class="name">LM2596 모듈</text>
  <text x="695" y="242" text-anchor="middle" class="pin">SZH-PWSD-001</text>
  <text x="695" y="262" text-anchor="middle" class="warn">★ 부하 연결 전 5.0V 조정</text>
  <text x="608" y="244" class="pin">IN+</text>
  <text x="608" y="292" class="pin">IN−</text>
  <text x="782" y="244" text-anchor="end" class="pin">OUT+</text>
  <text x="782" y="292" text-anchor="end" class="pin">OUT−</text>
  <!-- IN- / OUT- → GND -->
  <line x1="600" y1="288" x2="575" y2="288" class="gndw"/>
  <line x1="575" y1="288" x2="575" y2="620" class="gndw"/>
  <line x1="790" y1="288" x2="815" y2="288" class="gndw"/>
  <line x1="815" y1="288" x2="815" y2="620" class="gndw"/>
  <!-- OUT+ → ESP32 5V -->
  <line x1="790" y1="240" x2="880" y2="240" class="pwr"/>
  <text x="826" y="232" class="net" fill="#c0392b">+5.0V</text>

  <!-- ═══════════ ESP32-S3 개발보드 ═══════════ -->
  <rect x="880" y="180" width="240" height="300" class="box"/>
  <text x="1000" y="206" text-anchor="middle" class="name">ESP32-S3 개발보드</text>
  <text x="1000" y="222" text-anchor="middle" class="pin">N16R8 · VND018</text>
  <text x="888" y="244" class="pin">5V (VIN)</text>
  <text x="888" y="384" class="pin">3V3</text>
  <text x="888" y="414" class="pin">GPIO17 (TWAI TX)</text>
  <text x="888" y="444" class="pin">GPIO18 (TWAI RX)</text>
  <text x="1000" y="470" text-anchor="middle" class="pin">GND</text>
  <text x="1000" y="300" text-anchor="middle" class="note">USB-C: 펌웨어 플래시용</text>
  <text x="1000" y="316" text-anchor="middle" class="warn">USB와 VIN 동시 인가 금지</text>
  <!-- ESP32 GND → 레일 -->
  <line x1="1000" y1="480" x2="1000" y2="620" class="gndw"/>

  <!-- ═══════════ CAN 트랜시버 모듈 ═══════════ -->
  <rect x="600" y="360" width="200" height="150" class="box"/>
  <text x="700" y="386" text-anchor="middle" class="name">SN65HVD230 모듈</text>
  <text x="700" y="402" text-anchor="middle" class="pin">VLT-CAN002 (3.3V)</text>
  <text x="700" y="500" text-anchor="middle" class="warn">★ 120Ω 종단저항(R2) 제거</text>
  <text x="608" y="434" class="pin">CANH</text>
  <text x="608" y="464" class="pin">CANL</text>
  <text x="792" y="384" text-anchor="end" class="pin">VCC</text>
  <text x="792" y="414" text-anchor="end" class="pin">D (TX)</text>
  <text x="792" y="444" text-anchor="end" class="pin">R (RX)</text>
  <text x="792" y="474" text-anchor="end" class="pin">GND</text>

  <!-- CAN 배선: OBD 6/14 → CANH/CANL -->
  <line x1="190" y1="330" x2="470" y2="330" class="can"/>
  <line x1="470" y1="330" x2="470" y2="430" class="can"/>
  <line x1="470" y1="430" x2="600" y2="430" class="can"/>
  <text x="240" y="322" class="net" fill="#1c5cab">CAN_H</text>

  <line x1="190" y1="370" x2="440" y2="370" class="can"/>
  <line x1="440" y1="370" x2="440" y2="460" class="can"/>
  <line x1="440" y1="460" x2="600" y2="460" class="can"/>
  <text x="240" y="362" class="net" fill="#1c5cab">CAN_L</text>

  <!-- 트랜시버 우측 → ESP32 -->
  <line x1="800" y1="380" x2="880" y2="380" class="wire"/>
  <text x="826" y="372" class="net" fill="#e67e22">3V3</text>
  <line x1="800" y1="410" x2="880" y2="410" class="wire"/>
  <line x1="800" y1="440" x2="880" y2="440" class="wire"/>
  <!-- 트랜시버 GND → 레일 -->
  <line x1="800" y1="470" x2="840" y2="470" class="gndw"/>
  <line x1="840" y1="470" x2="840" y2="620" class="gndw"/>

  <!-- ═══════════ GND 레일 ═══════════ -->
  <line x1="190" y1="450" x2="215" y2="450" class="gndw"/>
  <line x1="190" y1="480" x2="215" y2="480" class="gndw"/>
  <line x1="215" y1="450" x2="215" y2="620" class="gndw"/>
  <line x1="215" y1="620" x2="1060" y2="620" class="gndw" stroke-width="2.6"/>
  <circle cx="520" cy="620" r="3.5" class="dot"/>
  <circle cx="575" cy="620" r="3.5" class="dot"/>
  <circle cx="815" cy="620" r="3.5" class="dot"/>
  <circle cx="840" cy="620" r="3.5" class="dot"/>
  <circle cx="1000" cy="620" r="3.5" class="dot"/>
  <circle cx="215" cy="480" r="3.5" class="dot"/>
  <!-- GND 심볼 -->
  <line x1="640" y1="620" x2="640" y2="638" class="gndw"/>
  <line x1="624" y1="638" x2="656" y2="638" class="gndw" stroke-width="2.6"/>
  <line x1="630" y1="645" x2="650" y2="645" class="gndw" stroke-width="2"/>
  <line x1="636" y1="652" x2="644" y2="652" class="gndw" stroke-width="1.6"/>
  <text x="666" y="644" class="net">GND (공통)</text>

  <!-- ═══════════ 노트 ═══════════ -->
  <rect x="40" y="672" width="1080" height="84" fill="#f9f9f7" stroke="#c3c2b7" stroke-width="1"/>
  <text x="56" y="694" class="note" font-weight="700">조립 노트</text>
  <text x="56" y="712" class="note">① 교차하는 선은 점(●)이 있을 때만 연결. ② SS34: 밴드(캐소드)가 LM2596 쪽. ③ P6KE24A: 밴드가 +12V 쪽(위). ④ CAN_H/CAN_L은 꼬아서(트위스트) 짧게.</text>
  <text x="56" y="730" class="note">⑤ 벤치 검증은 docs/bench-test.md 절차대로: 전원부 단독 → ESP32 단독(USB) → 결합 → CAN → 실차. ⑥ 실차 연결 시 OBD 16번이 벤치의 12V 어댑터 자리를 대체.</text>
  <text x="56" y="748" class="warn">⑦ LM2596 5.0V 조정 전에 ESP32를 절대 연결하지 말 것 · USB와 VIN 동시 인가 금지</text>
</svg>

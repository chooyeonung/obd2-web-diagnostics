<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1720" font-family="'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <style>
      .t-title { font-size: 20px; font-weight: 800; fill: #1a1a19; }
      .t-step  { font-size: 16px; font-weight: 800; fill: #ffffff; }
      .t-name  { font-size: 12px; font-weight: 700; fill: #1a1a19; }
      .t-pin   { font-size: 10px; font-weight: 700; fill: #1a1a19; }
      .t-pin-w { font-size: 10px; font-weight: 700; fill: #ffffff; }
      .t-note  { font-size: 12px; fill: #52514e; }
      .t-warn  { font-size: 12px; font-weight: 700; fill: #c0392b; }
      .wire-r { stroke: #e74c3c; stroke-width: 5; fill: none; stroke-linecap: round; }
      .wire-o { stroke: #e67e22; stroke-width: 5; fill: none; stroke-linecap: round; }
      .wire-y { stroke: #f1c40f; stroke-width: 5; fill: none; stroke-linecap: round; }
      .wire-k { stroke: #2c2c2a; stroke-width: 5; fill: none; stroke-linecap: round; }
      .wire-b { stroke: #3498db; stroke-width: 5; fill: none; stroke-linecap: round; }
      .wire-p { stroke: #9b59b6; stroke-width: 5; fill: none; stroke-linecap: round; }
      .dim { opacity: 0.35; }
    </style>

    <!-- ═══════ 공통 배치 (부품 실물 그림) ═══════ -->
    <g id="base">
      <!-- ── OBD-II 커넥터 ── -->
      <path d="M20,120 L160,120 L150,235 L30,235 Z" fill="#2c2c2a" stroke="#111" stroke-width="2"/>
      <path d="M32,132 L148,132 L140,223 L40,223 Z" fill="#454440"/>
      <!-- 핀: 윗줄 1~8, 아랫줄 9~16 -->
      <g>
        <circle cx="45" cy="158" r="5" fill="#6b6a66"/><circle cx="59" cy="158" r="5" fill="#6b6a66"/>
        <circle cx="73" cy="158" r="5" fill="#6b6a66"/>
        <circle cx="87" cy="158" r="6" fill="#111"/>   <!-- 4 GND -->
        <circle cx="101" cy="158" r="6" fill="#111"/>  <!-- 5 GND -->
        <circle cx="115" cy="158" r="6" fill="#3498db"/> <!-- 6 CANH -->
        <circle cx="129" cy="158" r="5" fill="#6b6a66"/><circle cx="143" cy="158" r="5" fill="#6b6a66"/>
        <circle cx="45" cy="196" r="5" fill="#6b6a66"/><circle cx="59" cy="196" r="5" fill="#6b6a66"/>
        <circle cx="73" cy="196" r="5" fill="#6b6a66"/><circle cx="87" cy="196" r="5" fill="#6b6a66"/>
        <circle cx="101" cy="196" r="5" fill="#6b6a66"/>
        <circle cx="115" cy="196" r="6" fill="#3498db"/> <!-- 14 CANL -->
        <circle cx="129" cy="196" r="5" fill="#6b6a66"/>
        <circle cx="143" cy="196" r="6" fill="#e74c3c"/> <!-- 16 +12V -->
      </g>
      <text x="87" y="149" text-anchor="middle" class="t-pin-w">4</text>
      <text x="101" y="149" text-anchor="middle" class="t-pin-w">5</text>
      <text x="115" y="149" text-anchor="middle" class="t-pin-w">6</text>
      <text x="115" y="213" text-anchor="middle" class="t-pin-w">14</text>
      <text x="143" y="213" text-anchor="middle" class="t-pin-w">16</text>
      <text x="90" y="256" text-anchor="middle" class="t-name">OBD-II 커넥터</text>
      <text x="90" y="270" text-anchor="middle" class="t-note" font-size="10">(배선면 = 커넥터 뒷면)</text>

      <!-- ── 폴리스위치 (노란 원판) ── -->
      <line x1="225" y1="95" x2="225" y2="120" stroke="#8a8781" stroke-width="3"/>
      <line x1="249" y1="95" x2="249" y2="120" stroke="#8a8781" stroke-width="3"/>
      <ellipse cx="237" cy="78" rx="22" ry="20" fill="#f4c430" stroke="#b8860b" stroke-width="2"/>
      <text x="237" y="83" text-anchor="middle" class="t-pin">1.1A</text>
      <text x="237" y="140" text-anchor="middle" class="t-name" font-size="11">폴리스위치</text>
      <circle cx="225" cy="118" r="4" fill="#d4af37" stroke="#8a6d1a"/>
      <circle cx="249" cy="118" r="4" fill="#d4af37" stroke="#8a6d1a"/>

      <!-- ── SS34 (검정 SMD + 은색 밴드) ── -->
      <line x1="305" y1="105" x2="325" y2="105" stroke="#8a8781" stroke-width="3"/>
      <line x1="371" y1="105" x2="391" y2="105" stroke="#8a8781" stroke-width="3"/>
      <rect x="325" y="92" width="46" height="26" rx="3" fill="#111"/>
      <rect x="361" y="92" width="8" height="26" fill="#d8d7d2"/>
      <text x="348" y="109" text-anchor="middle" class="t-pin-w" font-size="9">SS34</text>
      <text x="348" y="140" text-anchor="middle" class="t-name" font-size="11">쇼트키 (밴드→우측)</text>
      <circle cx="305" cy="105" r="4" fill="#d4af37" stroke="#8a6d1a"/>
      <circle cx="391" cy="105" r="4" fill="#d4af37" stroke="#8a6d1a"/>

      <!-- ── P6KE24A (원통 + 밴드, 세로) ── -->
      <line x1="437" y1="120" x2="437" y2="140" stroke="#8a8781" stroke-width="3"/>
      <line x1="437" y1="196" x2="437" y2="216" stroke="#8a8781" stroke-width="3"/>
      <rect x="425" y="140" width="24" height="56" rx="6" fill="#2f2f2d"/>
      <rect x="425" y="146" width="24" height="9" fill="#d8d7d2"/>
      <text x="418" y="162" text-anchor="end" class="t-name" font-size="11">P6KE24A</text>
      <text x="418" y="176" text-anchor="end" class="t-note" font-size="10">(밴드 = 위쪽)</text>
      <circle cx="437" cy="120" r="4" fill="#d4af37" stroke="#8a6d1a"/>
      <circle cx="437" cy="216" r="4" fill="#d4af37" stroke="#8a6d1a"/>

      <!-- ── LM2596 모듈 (파란 기판) ── -->
      <rect x="500" y="30" width="185" height="115" rx="6" fill="#1c5cab" stroke="#0d366b" stroke-width="2"/>
      <circle cx="590" cy="85" r="24" fill="#4a4a48" stroke="#222"/>
      <circle cx="590" cy="85" r="16" fill="#6b6a66"/>
      <rect x="521" y="55" width="20" height="42" rx="9" fill="#333"/>
      <rect x="641" y="55" width="20" height="42" rx="9" fill="#333"/>
      <rect x="608" y="34" width="26" height="20" fill="#2a6fd6" stroke="#0d366b"/>
      <circle cx="621" cy="44" r="6" fill="#d8d7d2"/>
      <line x1="617" y1="40" x2="625" y2="48" stroke="#555" stroke-width="2"/>
      <text x="621" y="26" text-anchor="middle" class="t-pin">← 5.0V 조정 나사</text>
      <circle cx="510" cy="45" r="6" fill="#d4af37" stroke="#8a6d1a"/>
      <circle cx="510" cy="130" r="6" fill="#d4af37" stroke="#8a6d1a"/>
      <circle cx="675" cy="45" r="6" fill="#d4af37" stroke="#8a6d1a"/>
      <circle cx="675" cy="130" r="6" fill="#d4af37" stroke="#8a6d1a"/>
      <text x="524" y="49" class="t-pin-w">IN+</text>
      <text x="524" y="134" class="t-pin-w">IN−</text>
      <text x="661" y="49" text-anchor="end" class="t-pin-w">OUT+</text>
      <text x="661" y="134" text-anchor="end" class="t-pin-w">OUT−</text>
      <text x="592" y="162" text-anchor="middle" class="t-name">LM2596 모듈 (12V→5V)</text>

      <!-- ── ESP32-S3 개발보드 ── -->
      <rect x="740" y="20" width="340" height="185" rx="8" fill="#111" stroke="#000" stroke-width="2"/>
      <rect x="800" y="30" width="220" height="70" rx="4" fill="#8a8781" stroke="#555"/>
      <rect x="810" y="38" width="120" height="54" fill="#6b6a66"/>
      <text x="915" y="70" text-anchor="middle" class="t-pin-w">ESP32-S3-WROOM-1</text>
      <rect x="726" y="45" width="26" height="40" rx="4" fill="#c3c2b7" stroke="#52514e"/>
      <text x="739" y="100" text-anchor="middle" class="t-pin">USB</text>
      <!-- 핀 줄 (아랫줄만 표기) -->
      <g fill="#d4af37" stroke="#8a6d1a">
        <circle cx="775" cy="192" r="6"/><circle cx="808" cy="192" r="6"/>
        <circle cx="900" cy="192" r="6"/><circle cx="940" cy="192" r="6"/><circle cx="980" cy="192" r="6"/>
      </g>
      <text x="775" y="176" text-anchor="middle" class="t-pin-w">5V</text>
      <text x="808" y="176" text-anchor="middle" class="t-pin-w">GND</text>
      <text x="900" y="176" text-anchor="middle" class="t-pin-w">3V3</text>
      <text x="940" y="176" text-anchor="middle" class="t-pin-w">IO17</text>
      <text x="980" y="176" text-anchor="middle" class="t-pin-w">IO18</text>
      <text x="910" y="226" text-anchor="middle" class="t-name">ESP32-S3 개발보드</text>

      <!-- ── SN65HVD230 모듈 (보라 기판) ── -->
      <rect x="560" y="255" width="160" height="92" rx="6" fill="#5b3a8e" stroke="#3a2560" stroke-width="2"/>
      <rect x="648" y="262" width="34" height="22" fill="#111"/>
      <text x="665" y="276" text-anchor="middle" class="t-pin-w" font-size="8">HVD230</text>
      <!-- R2 (제거 대상) -->
      <rect x="692" y="266" width="16" height="10" fill="#111"/>
      <line x1="688" y1="262" x2="712" y2="280" stroke="#e74c3c" stroke-width="3"/>
      <line x1="712" y1="262" x2="688" y2="280" stroke="#e74c3c" stroke-width="3"/>
      <text x="700" y="296" text-anchor="middle" class="t-warn" font-size="10">R2 제거!</text>
      <!-- 좌: CANH/CANL -->
      <circle cx="572" cy="275" r="6" fill="#d4af37" stroke="#8a6d1a"/>
      <circle cx="572" cy="305" r="6" fill="#d4af37" stroke="#8a6d1a"/>
      <text x="586" y="279" class="t-pin-w">CANH</text>
      <text x="586" y="309" class="t-pin-w">CANL</text>
      <!-- 우하단: 3V3 GND D R -->
      <g fill="#d4af37" stroke="#8a6d1a">
        <circle cx="600" cy="334" r="5.5"/><circle cx="633" cy="334" r="5.5"/>
        <circle cx="666" cy="334" r="5.5"/><circle cx="696" cy="334" r="5.5"/>
      </g>
      <text x="600" y="358" text-anchor="middle" class="t-pin" font-size="9">3V3</text>
      <text x="633" y="358" text-anchor="middle" class="t-pin" font-size="9">GND</text>
      <text x="666" y="358" text-anchor="middle" class="t-pin" font-size="9">D</text>
      <text x="696" y="358" text-anchor="middle" class="t-pin" font-size="9">R</text>
      <text x="640" y="376" text-anchor="middle" class="t-name">SN65HVD230 CAN 모듈</text>
    </g>
  </defs>

  <rect width="1100" height="1720" fill="#ffffff"/>
  <text x="40" y="42" class="t-title">실물 배선 가이드 — 3단계로 따라 하기</text>
  <text x="40" y="64" class="t-note">같은 배치 그림에 단계별로 선만 추가됩니다. 금색 점 = 납땜/연결 지점 · 선 색 = 실제 사용할 전선 색 권장</text>

  <!-- ═══════════ 1단계: 전원부 ═══════════ -->
  <g transform="translate(40,90)">
    <rect x="0" y="0" width="1020" height="34" rx="8" fill="#e74c3c"/>
    <text x="16" y="23" class="t-step">1단계 — 전원 (빨강 +12V · 주황 +5V · 검정 GND)</text>
    <g transform="translate(0,50)">
      <use href="#base"/>
      <!-- 16번 → 폴리스위치 -->
      <path d="M143,196 C185,196 205,150 225,118" class="wire-r"/>
      <!-- 폴리스위치 → SS34 -->
      <path d="M249,118 C275,118 285,105 305,105" class="wire-r"/>
      <!-- SS34 → 분기점 → P6KE 위 + LM2596 IN+ -->
      <path d="M391,105 C410,105 425,110 437,120" class="wire-r"/>
      <path d="M437,120 C465,90 480,55 510,45" class="wire-r"/>
      <!-- P6KE 아래 → GND(IN−와 합류) -->
      <path d="M437,216 C465,235 490,180 510,130" class="wire-k"/>
      <!-- OBD 4,5 → LM2596 IN− -->
      <path d="M87,158 C87,90 300,190 510,130 M101,158 C110,120 300,185 510,130" class="wire-k"/>
      <!-- OUT+ → ESP32 5V -->
      <path d="M675,45 C720,45 750,120 775,192" class="wire-o"/>
      <!-- OUT− → ESP32 GND -->
      <path d="M675,130 C720,160 770,180 808,192" class="wire-k"/>
      <!-- CAN 모듈은 아직 없음 표시 -->
      <g><rect x="552" y="248" width="180" height="135" fill="#ffffff" opacity="0.82"/><text x="640" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">2·3단계에서 연결</text></g>
    </g>
    <g transform="translate(0,440)">
      <text x="0" y="0" class="t-note">① 커넥터 <tspan font-weight="700">16번 핀</tspan>(빨강)에서 출발 → 폴리스위치 → SS34(밴드가 LM2596 쪽) → LM2596 <tspan font-weight="700">IN+</tspan></text>
      <text x="0" y="20" class="t-note">② SS34와 IN+ 사이 지점에 P6KE24A를 끼움: 밴드(위)가 빨간 선 쪽, 반대쪽 다리는 검정(GND) 선으로</text>
      <text x="0" y="40" class="t-note">③ 커넥터 <tspan font-weight="700">4번+5번 핀</tspan>(검정, 둘 다)→ LM2596 <tspan font-weight="700">IN−</tspan></text>
      <text x="0" y="60" class="t-warn">④ 여기서 멈추고 12V 인가 → OUT+/OUT−에서 5.0V 조정 확인! → ⑤ OUT+→ESP32 5V(주황), OUT−→ESP32 GND(검정)</text>
    </g>
  </g>

  <!-- ═══════════ 2단계: CAN ═══════════ -->
  <g transform="translate(40,660)">
    <rect x="0" y="0" width="1020" height="34" rx="8" fill="#3498db"/>
    <text x="16" y="23" class="t-step">2단계 — CAN 신호 (파랑 2가닥, 꼬아서)</text>
    <g transform="translate(0,50)">
      <use href="#base" class="dim"/>
      <use href="#base" opacity="0"/>
      <!-- OBD 6 → CANH / 14 → CANL -->
      <path d="M115,158 C115,60 400,240 572,278" class="wire-b"/>
      <path d="M115,196 C130,260 400,300 572,316" class="wire-b"/>
    </g>
    <g transform="translate(0,440)">
      <text x="0" y="0" class="t-note">① 커넥터 <tspan font-weight="700">6번 핀</tspan> → CAN 모듈 <tspan font-weight="700">CANH</tspan> / <tspan font-weight="700">14번 핀</tspan> → <tspan font-weight="700">CANL</tspan> — 두 가닥을 서로 꼬아서(비틀어서) 배선</text>
      <text x="0" y="20" class="t-warn">② 배선 전에 CAN 모듈의 R2(120Ω, 빨간 X 표시 위치)를 인두로 제거했는지 다시 확인!</text>
    </g>
  </g>

  <!-- ═══════════ 3단계: 모듈-보드 연결 ═══════════ -->
  <g transform="translate(40,1180)">
    <rect x="0" y="0" width="1020" height="34" rx="8" fill="#9b59b6"/>
    <text x="16" y="23" class="t-step">3단계 — CAN 모듈 ↔ ESP32 (노랑 3V3 · 검정 GND · 보라 신호 2가닥)</text>
    <g transform="translate(0,50)">
      <use href="#base" class="dim"/>
      <!-- 3V3 -->
      <path d="M900,192 C880,260 720,320 600,334" class="wire-y"/>
      <!-- GND -->
      <path d="M808,192 C790,270 700,325 633,334" class="wire-k"/>
      <!-- IO4→D, IO5→R -->
      <path d="M940,192 C920,280 760,330 666,334" class="wire-p"/>
      <path d="M980,192 C970,300 790,338 696,334" class="wire-p"/>
    </g>
    <g transform="translate(0,440)">
      <text x="0" y="0" class="t-note">① ESP32 <tspan font-weight="700">3V3</tspan> → 모듈 <tspan font-weight="700">3V3</tspan>(노랑) · ESP32 <tspan font-weight="700">GND</tspan> → 모듈 <tspan font-weight="700">GND</tspan>(검정)</text>
      <text x="0" y="20" class="t-note">② ESP32 <tspan font-weight="700">IO17</tspan> → 모듈 <tspan font-weight="700">D</tspan> · ESP32 <tspan font-weight="700">IO18</tspan> → 모듈 <tspan font-weight="700">R</tspan> (보라 2가닥)</text>
      <text x="0" y="40" class="t-warn">③ 모듈 VCC는 반드시 3V3! (5V 연결하면 트랜시버 파손) — 완료 후 bench-test.md 2단계(펌웨어)로</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="'Segoe UI', 'Malgun Gothic', sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c0392b" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="780" height="560" fill="#ffffff"/>
  <text x="40" y="36" font-size="18" font-weight="800" fill="#1a1a19">PCB V2 배치 계획 — 66 × 36 mm (윗면에서 본 그림, 10px = 1mm)</text>

  <!-- 보드 -->
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="660" height="360" rx="8" fill="#14532d" stroke="#0d3b20" stroke-width="3"/>

    <!-- 안테나 금지구역 -->
    <rect x="0" y="20" width="80" height="200" fill="url(#hatch)" opacity="0.5"/>
    <text x="40" y="240" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">구리 금지</text>
    <text x="40" y="254" text-anchor="middle" font-size="10" fill="#e8eaf0">(안테나 영역)</text>

    <!-- 데브킷 외곽 (63×25.4 → 630×254), 위쪽에 -->
    <rect x="15" y="18" width="630" height="254" rx="6" fill="rgba(255,255,255,0.10)" stroke="#e8eaf0" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="330" y="42" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ESP32-S3 DevKitC (헤더 위 ~8.5mm 부상)</text>
    <!-- 안테나 -->
    <rect x="15" y="80" width="26" height="130" fill="rgba(233,196,106,0.35)" stroke="#e9c46a"/>
    <text x="28" y="150" text-anchor="middle" font-size="10" fill="#e9c46a" writing-mode="tb">안테나</text>
    <!-- USB -->
    <rect x="615" y="105" width="34" height="80" fill="#c3c2b7" stroke="#52514e"/>
    <text x="632" y="150" text-anchor="middle" font-size="10" fill="#1a1a19" writing-mode="tb">USB-C</text>

    <!-- 헤더 2줄 -->
    <rect x="90" y="26" width="540" height="16" fill="#111" opacity="0.8"/>
    <rect x="90" y="248" width="540" height="16" fill="#111" opacity="0.8"/>
    <text x="360" y="24" text-anchor="middle" font-size="9" fill="#c3c2b7">J4 (1×22)</text>
    <text x="360" y="278" text-anchor="middle" font-size="9" fill="#c3c2b7">J3 (1×22) — 핀10/11 = GPIO17/18(CAN_TX/RX), 핀21 = 5V, 핀22 = GND</text>

    <!-- ── 하부 존들 (헤더 사이 y=42..248) ── -->
    <!-- CAN존 -->
    <rect x="95" y="50" width="150" height="190" rx="6" fill="rgba(91,58,142,0.85)" stroke="#9085e9" stroke-width="2"/>
    <text x="170" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CAN 존</text>
    <text x="170" y="96" text-anchor="middle" font-size="10" fill="#e8eaf0">U1 SN65HVD230</text>
    <text x="170" y="110" text-anchor="middle" font-size="10" fill="#e8eaf0">C1 (VCC 2mm 이내)</text>
    <text x="170" y="124" text-anchor="middle" font-size="10" fill="#e8eaf0">R3 120Ω DNP · R2 0Ω</text>
    <text x="170" y="144" text-anchor="middle" font-size="9.5" fill="#c8bfe8">CAN_H/L 차동 페어</text>
    <text x="170" y="157" text-anchor="middle" font-size="9.5" fill="#c8bfe8">커넥터→D3→U1 최단</text>

    <!-- 벅존 -->
    <rect x="265" y="50" width="185" height="190" rx="6" fill="rgba(28,92,171,0.85)" stroke="#3987e5" stroke-width="2"/>
    <text x="357" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">벅 컨버터 존</text>
    <text x="357" y="96" text-anchor="middle" font-size="10" fill="#e8eaf0">U2 TPS54360B (열비아 4+)</text>
    <text x="357" y="110" text-anchor="middle" font-size="10" fill="#e8eaf0">L1 10µH 6060 (h4.5mm)</text>
    <text x="357" y="124" text-anchor="middle" font-size="10" fill="#e8eaf0">D10 B360A · C10~C16</text>
    <text x="357" y="144" text-anchor="middle" font-size="9.5" fill="#bcd6f5">VIN 루프 최소 · SW 면적 최소</text>
    <text x="357" y="157" text-anchor="middle" font-size="9.5" fill="#bcd6f5">FB는 L/SW에서 멀리</text>

    <!-- 입력보호존 -->
    <rect x="470" y="50" width="140" height="190" rx="6" fill="rgba(183,84,38,0.85)" stroke="#ec835a" stroke-width="2"/>
    <text x="540" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">입력 보호 존</text>
    <text x="540" y="96" text-anchor="middle" font-size="10" fill="#e8eaf0">F1 1812 퓨즈</text>
    <text x="540" y="110" text-anchor="middle" font-size="10" fill="#e8eaf0">D1 SM8S24A</text>
    <text x="540" y="124" text-anchor="middle" font-size="10" fill="#e8eaf0">Q1 TO-252 + R1</text>
    <text x="540" y="138" text-anchor="middle" font-size="10" fill="#ffd9c9" font-weight="700">D2 제너 (방향 반전 수정!)</text>

    <!-- JST-XH 커넥터 (하단 엣지) -->
    <rect x="95" y="318" width="165" height="42" fill="#e8e4d8" stroke="#8a8781" stroke-width="2"/>
    <text x="177" y="338" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a19">JST-XH 6P (사이드)</text>
    <text x="177" y="352" text-anchor="middle" font-size="9" fill="#52514e">VBAT·CH_GND·SIG_GND·CANH·CANL·NC</text>
    <!-- D3 위치 -->
    <rect x="270" y="322" width="46" height="20" rx="3" fill="#5b3a8e" stroke="#9085e9"/>
    <text x="293" y="336" text-anchor="middle" font-size="9" fill="#fff">D3 NUP</text>
    <text x="293" y="356" text-anchor="middle" font-size="8.5" fill="#c8bfe8">커넥터 3mm 이내</text>

    <!-- TP 열 -->
    <g fill="#d4af37" stroke="#8a6d1a">
      <circle cx="360" cy="332" r="6"/><circle cx="390" cy="332" r="6"/><circle cx="420" cy="332" r="6"/><circle cx="450" cy="332" r="6"/>
      <circle cx="480" cy="332" r="6"/><circle cx="510" cy="332" r="6"/><circle cx="540" cy="332" r="6"/><circle cx="570" cy="332" r="6"/>
    </g>
    <text x="465" y="356" text-anchor="middle" font-size="9.5" fill="#e8eaf0">TP1~8 (D1.5 SMD 패드, 일렬)</text>

    <!-- 치수 -->
    <text x="330" y="-12" text-anchor="middle" font-size="12" fill="#1a1a19" font-weight="700" transform="translate(0,0)">66 mm</text>
  </g>
  <text x="745" y="250" font-size="12" font-weight="700" fill="#1a1a19" writing-mode="tb">36 mm</text>

  <!-- 노트 -->
  <g transform="translate(60,458)" font-size="11.5" fill="#52514e">
    <text y="0">① 하부 존 부품 최대 높이 4.5mm(L1) &lt; 데브킷 부상 높이 8.5mm — 간섭 없음   ② 안테나 왼쪽 8mm: 전층 구리·부품 금지 (또는 안테나를 엣지 밖으로 돌출)</text>
    <text y="20">③ USB-C는 보드 오른쪽 엣지에 맞춤 (케이블 접근)   ④ 벅 열패드 GND 비아 4개 이상   ⑤ V1 수정사항: D2 반전, C1 근접, GPIO17/18</text>
    <text y="40" fill="#c0392b" font-weight="700">발주 전: DevKitC-1 실물 실크에서 J3 핀10/11이 GPIO17/18인지 최종 확인 (보드 리비전에 따라 다를 수 있음)</text>
  </g>
</svg>
